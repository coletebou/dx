# =============================================================================
# INTEGRATIONS & AUTOMATIONS
# =============================================================================
# Everything outside this file that reads, writes, or hooks into this tmux
# setup. If you change a binding or rename a helper script, check this list.
#
# ── External helpers wired from inside this file ────────────────────────────
#   status-left          ~/.dotfiles/base/tmux-hostname.sh        (colored hostname,
#                        run once at load into @host-label)
#   status-right         ~/.dotfiles/base/tmux-agent-activity.sh  (publishes each
#                        window's @recency_fg; prints nothing)
#                        ~/.dotfiles/base/tmux-windows-active.sh  (N/M active/total windows)
#                        ~/.dotfiles/base/tmux-vitals.sh          (battery/load)
#   resurrect save hook  ~/.dotfiles/scripts/tmux-resurrect-claude-save
#   resurrect restore    ~/.dotfiles/scripts/tmux-resurrect-claude-restore
#   Alt-C clipboard      ~/.dotfiles/base/tmux-copy-buffer.sh     (OSC 52 copy)
#   prefix c / | / -     ~/.dotfiles/base/tmux-ssh-inherit.sh     (ssh-aware new
#                        window/split: inherits the current pane's ssh host +
#                        remote cwd. Reads #{pane_path}, which base/zshrc's
#                        _report_cwd_osc7 precmd hook publishes via OSC 7 —
#                        if you remove that hook, remote-cwd inheritance
#                        degrades to the remote $HOME. prefix C-c = local.)
#
# ── Plugins (TPM, see PLUGINS section at bottom) ────────────────────────────
#   tmux-sensible        sane defaults
#   tmux-resurrect       prefix+Ctrl-s save, prefix+Ctrl-r restore
#   tmux-continuum       auto-save every 15min; auto-restore OFF (manual only)
#
# ── Shell-side helpers that create/attach sessions ──────────────────────────
#   tm                   ~/.dotfiles/base/aliases.sh               fzf session picker
#
# ── External scripts/skills that drive tmux (non-interactive) ───────────────
#   parallel-worktrees   ~/.claude/skills/parallel-worktrees/bin/pw
#                        Creates session + one window per worktree, sends
#                        claude launch commands via `send-keys`. Local-only.
#   tmux-archive         ~/.claude/skills/tmux-archive/bin/tmux-archive
#                        Read-only: snapshots every pane's scrollback to disk.
#   tmux-organize        ~/.claude/skills/tmux-organize/bin/tmux-apply-plan
#                        Renames/reorders windows/sessions per a plan file.
#
# ── Claude Code hooks that touch tmux (base/claude, wired in settings.base.json)
#   tmux-rename-hook.sh  Stop + UserPromptSubmit: names the window after a
#                        /rename title, clears a stale handoff badge
#   branch-tmux-hook.sh  SessionStart(fork): reopens the pre-/branch session
#                        in a new window
#   statusline.sh        registers each Claude pane (@claude_reg) for the
#                        recency colors computed by tmux-agent-activity.sh
#   Windows without a /rename title keep tmux's automatic-rename, see
#   `set -g automatic-rename-format` below.
#
# =============================================================================

# Increase scrollback buffer (Claude outputs can be long)
set -g history-limit 50000

# Mouse on: tmux handles scroll wheel (enters copy mode), drag selection,
# and pane focus clicks. Toggle on demand with prefix + M when you'd
# rather the outer terminal own selection/scrollback for a specific pane.
set -g mouse on
bind M set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# Scroll-wheel direction (inverted) — restore the old tmux-vs-Termius split.
# A Termius update flipped the wheel events it sends over the wire, so a
# finger-up swipe now arrives as WheelDown (it used to arrive as WheelUp).
# tmux's stock bindings therefore started scrolling the SAME direction as
# Termius-native; these overrides re-invert tmux so finger-up again reveals
# older/above scrollback (differing from Termius-native, as it used to).
# Applies wherever this config is installed — desktop Ghostty->tmux scroll is
# intentionally flipped to match. Caveat: panes running a full-screen
# app that grabs the mouse (mouse_any_flag: e.g. vim mouse=a, less mouse) forward
# the raw event via send-keys -M and are NOT re-inverted here.
#
# root table = live tail (normal mode): finger-up (now WheelDown) enters scrollback.
bind-key -T root WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
bind-key -T root WheelUpPane   if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M }
# copy-mode tables = already scrolled in: swap up/down so finger-up keeps revealing
# older content and finger-down returns to the live tail (-e exits at the bottom).
bind-key -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 5 scroll-down
bind-key -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-up

# Better colors (true color support)
set -g default-terminal "tmux-256color"
# The terminal-overrides / terminal-features lines in this file APPEND, so each
# reload (prefix r, dotsync) used to add another copy of every entry: a 13-day-old
# server had 276 overrides and 140 features. Start each load from tmux's defaults.
set -su terminal-overrides
set -su terminal-features
set -ga terminal-overrides ",*256col*:Tc"
# Ghostty-specific: tell tmux the outer terminal is Ghostty and accepts RGB.
# Additive with *256col*:Tc — explicit entry matches first when TERM=xterm-ghostty.
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Self-heal the SERVER-GLOBAL TERM on every client attach. tmux captures TERM
# into its global environment at server-start; if the server first started from
# a non-Ghostty SSH session (TERM=xterm-256color), every NEW window since then
# inherits the wrong terminal type and Ghostty's RGB/feature overrides above
# never match → degraded rendering. This hook
# copies the CURRENTLY-attached client's TERM into the global env on each
# attach, so the next window/pane always gets the right terminal. Harmless when
# already correct. (update-environment refreshes the per-session TERM on attach;
# this covers the global env that detached/new windows inherit.)
set -g update-environment "TERM TERM_PROGRAM COLORTERM DISPLAY SSH_AUTH_SOCK SSH_CONNECTION"
# set-environment -F exists in tmux 3.2, below this config's tested 3.4 floor.
set-hook -g client-attached 'set-environment -gF TERM "#{client_termname}"'

# Styled underlines (undercurl / double / dotted / dashed) — needed for
# Neovim LSP diagnostics to render as curly red underlines, not straight.
# tmux's stock terminfo predates these ncurses caps; splice them in.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Extended keyboard protocol (CSI u / kitty keyboard). Without this,
# Ghostty's Alt/Ctrl+<key> encodings leak into tmux panes as literal
# escape chars instead of being delivered to the focused program.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# OSC 8 hyperlinks (Ghostty, iTerm2, WezTerm): without this tmux drops them, so
# the Claude Code statusline's issue link would not be clickable.
set -as terminal-features 'xterm*:hyperlinks'

# Enable focus events for better TUI app responsiveness
set -g focus-events on

# Status bar
# tmux 3.7 is the first release with both the sorted format loops (added in 3.6)
# and the chooser preview option used below. Probe the newer preview option so
# its presence guarantees both on official releases. Keep the stock one-row bar
# on older hosts; the stored line-1 format is inert until status reaches two.
# @recent-row-initialized is absent on first load and set below, so a later
# source-file preserves the user's runtime off/on/two-row choice.
if-shell 'tmux show-options -gw tree-mode-preview-format >/dev/null 2>&1' \
    'if-shell -F "#{==:#{@recent-row-initialized},}" "set -g status 2"'
set -g status-style bg=colour235,fg=colour136
set -g status-left-length 60
set -g status-right-length 80
# 5s, and it must stay explicit: tmux-sensible (PLUGINS below) rewrites a 15 to 5,
# because 15 is tmux's default and it cannot tell "set to 15" from "never set".
# This line used to say 15, and the bar has always really refreshed every 5s.
set -g status-interval 5

# Status-left: <hostname>:<session> [SYNC?]
#   - hostname shortened per your identity's hosts file (base/host-label.sh)
#     AND color-coded: orange (work) / green (anything else). Replaces a
#     separate [work]/[personal] badge — color is the signal.
#   - SYNC warning when synchronize-panes is active (safety — easy to forget)
#   - The hostname cannot change for the life of the server, so it is computed
#     ONCE here into @host-label, as set-titles-string is below. As a #() job it
#     was empty on each client's first draw, and the whole bar jumped right when
#     the output arrived. #{@host-label} keeps its #[...] colors: styles are
#     applied when the bar is drawn, after expansion.
if-shell 'tmux run-shell -E ":" >/dev/null 2>&1' \
    'run-shell -E "tmux set -g @host-label \"$(~/.dotfiles/base/tmux-hostname.sh)\""' \
    'run-shell "tmux set -g @host-label \"$(~/.dotfiles/base/tmux-hostname.sh)\""'
set -g status-left '#{@host-label}#[fg=colour240]:#[fg=colour148]#S #{?pane_synchronized,#[bg=colour160#,fg=colour255#,bold] SYNC #[default] ,}'

# Window names colored by ACTIVITY RECENCY — same idea as the ✎ segment in the
# Claude Code statusline, per window: how long since this window last did
# something. Lets you see at a glance which of 50 windows are alive.
#
#   < 1m    green   (colour46)  — producing output right now
#   < 15m   yellow  (colour178) — recently active
#   < 1h    blue    (colour75)  — quiet a while
#   older   grey    (colour245) — dormant
#
# "Did something" depends on the window: a Claude Code window counts writes to
# its session's transcript, subagent and background-shell files, every other
# window its last output (#{window_activity}). See tmux-agent-activity.sh.
#
# That script (status-right) computes each window's color and publishes it as
# the window option @recency_fg; the formats here only look it up. They used to
# compute it themselves (an age per threshold, each re-expanding the window's
# timestamp), at ~1ms per window. tmux 3.7 stops expanding a status line after
# 100ms (FORMAT_TIME_LIMIT) and draws whatever is left as empty, so a 75-window
# session lost its current window and all of status-right, and the list snapped
# back to window 1: the window row flashed about once a second. A lookup is ~12x
# cheaper. Keep per-window work in these formats to lookups.
#
# Colors step whenever the script runs, i.e. at status-interval. A window has no
# @recency_fg of its own until the script's first pass, so it reads as dormant.
#
# The current window keeps its own bold treatment below so "where am I" is never
# ambiguous, but it is colored by the same rule.
set -gw @recency_fg colour245
# A window whose Claude session handed off (fresh-session-handoff's launch.sh
# sets @handoff_to on it) leads with a red ⤳ badge, so a finished session reads
# as finished from any window. tmux-rename-hook.sh clears it once a different
# Claude session starts in that pane.
set -g @handoff-badge '#{?#{@handoff_to},#[bg=colour196#,fg=colour231#,bold] ⤳ #[default],}'
set -g window-status-format         '#{E:@handoff-badge}#[fg=#{@recency_fg}]#I:#W#{?window_flags,#{window_flags}, }#[default]'
set -g window-status-current-format '#{E:@handoff-badge}#[fg=#{@recency_fg},bold]#I:#W#{?window_flags,#{window_flags}, }#[default]'

# The second status row is a session switcher: every session on the server, in
# session-number order, so a given session never moves. The first row answers
# "which window am I on"; this one answers "what else is running, and where".
#
# S/i: sorts by session number natively (3.6+), and the loop's second
# comma-separated format styles the CURRENT session — bold gold, matching
# status-left. That pairing is why this needs no shell helper: the previous
# recency-ranked row DID, because nested S:/W: loops cannot rank a session by
# its newest child window, but ordering by number is something tmux does itself.
#
# range=session|<id> makes each name clickable. Unlike range=user, tmux resolves
# the target itself and passes it to the Status mouse key as `-t=`, so the stock
# `switch-client -t=` binding below handles cross-session clicks with no custom
# expansion and no 15-byte payload limit.
#
# Session names are user-controlled, so '#' is neutralized — otherwise a name
# like 'a#[bg=red]' would inject a style into the row.
set -g @recent-row-initialized 1
set -g status-format[1] '#[align=left]#[fg=colour240]sessions #[default]#{S/i:#[range=session|#{session_id}]#[fg=colour245]#{s|[#]|?|:session_name}#[default]#[norange]  ,#[range=session|#{session_id}]#[fg=colour148#,bold]#{s|[#]|?|:session_name}#[default]#[norange]  }'

# The prefix+s / prefix+w chooser is colored exactly like the bar, which is where
# picking a live session out of ~15 actually matters:
#   session rows  current session bold colour148, others colour245 (row 1 above)
#   window rows   ⤳ badge + recency color, current window bold     (row 0 above)
#   pane rows     their window's recency color
#
# NOTE `tree-mode-format` is NOT a settable option in tmux 3.4 — `set -g
# tree-mode-format` errors with "invalid option". `tree_mode_format` exists only
# as a READ-ONLY format variable (visible in `tmux display-message -a`), so the
# customization has to ride on `choose-tree -F` in the key binding instead. That
# is why the format lives on the bind lines below rather than in an option.
#
# The body is tmux's stock tree_mode_format verbatim (captured from
# `display-message -a`) with only a color wrapper added: the three-way
# pane/window/session branch, the marked-#[reverse] handling, the pane_title
# suffixes and the "N windows (attached)" summary are all unchanged, so the
# chooser behaves exactly as stock. Re-capture the default if tmux is upgraded.
# Row type: exactly one of pane_format / window_format / session_format is 1 per
# row (verified by rendering all three on 3.8).
#
# Recency is the same published @recency_fg the bar reads (pane rows resolve it
# through their window). The chooser's format tree has NO client, verified by
# rendering a real chooser on 3.8 and capturing its pane, so #{client_session} is
# empty and "current session" is unknowable from inside. The bind lines below
# snapshot it as @chooser-session while the client IS in context.
#
# Stored in a user option and referenced via #{E:...} so the giant expression is
# written once rather than twice on two bind lines. #{E:} does a full recursive
# expansion (unlike %hidden, which stops after one level, and would leave the
# nested #{E:@handoff-badge} literal).
set -g @tree-fmt '#{?pane_format,#[fg=#{@recency_fg}]#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{&&:#{!=:#{pane_title},#{host_short}},#{!=:#{pane_title},#{host}}}},: "#{pane_title}",},#{?window_format,#{E:@handoff-badge}#[fg=#{@recency_fg}]#{?#{&&:#{window_active},#{==:#{session_id},#{@chooser-session}}},#[bold],}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{&&:#{!=:#{pane_title},#{host_short}},#{!=:#{pane_title},#{host}}}}},: "#{pane_title}",},#{?#{==:#{session_id},#{@chooser-session}},#[fg=colour148#,bold],#[fg=colour245]}#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}#[default]'

# Label the chooser preview with enough context to identify generic "codex" and
# "claude" windows. Strip only the conventional ~/code prefix; paths elsewhere
# remain absolute. The row itself still carries the recency color.
if-shell 'tmux show-options -gw tree-mode-preview-format >/dev/null 2>&1' 'set -gw tree-mode-preview-format "#{session_name}:#{window_index}#{?pane_format,.#{pane_index},} #{?pane_format,#{pane_current_command},#{window_name}} · #{s~^/(Users|home)/[^/]+/code/~~:pane_current_path}#{?#{&&:#{pane_title},#{&&:#{!=:#{pane_title},#{host_short}},#{!=:#{pane_title},#{host}}}}, · #{=/40/…:pane_title},}"'

# The set -gF snapshots the current session for @tree-fmt (see the note above).
# It is server-global, so two clients opening choosers at once would share the
# later one's value; harmless for one person. -Zs / -Zw match the stock bindings.
bind s set -gF @chooser-session '#{session_id}' \; choose-tree -Zs -F '#{E:@tree-fmt}'
bind w set -gF @chooser-session '#{session_id}' \; choose-tree -Zw -F '#{E:@tree-fmt}'

# Status-right: active-windows counter + vitals + zulu time
#   tmux-windows-active.sh prints "N/M " — windows that produced output in the
#   last 5s over total windows, active count green when > 0. Harness-agnostic:
#   replaced a per-tool counter (claude agents --json + pgrep codex) that needed
#   one query per tool, could only report busy/idle for claude, and missed
#   everything else doing work. Sits left of vitals.
#   ONE clock, UTC only. There used to be a second `%a %H:%M` local-time segment
#   ahead of this one; dropped because machines are a mix of UTC servers (where
#   the two segments printed the SAME minute twice) and local-TZ laptops (where
#   two differing clocks side by side just invite misreading one for the other). UTC is the shared frame for logs, deploys and Zulu-stamped
#   handoffs, so it is the one that stays.
#   Zulu via #(date -u) because tmux strftime can't override TZ; refreshes on
#   status-interval (5s) like every other #() segment.
#   tmux-agent-activity.sh prints nothing: it rides status-interval to publish
#   each window's @recency_fg for the recency colors above.
set -g status-right '#(~/.dotfiles/base/tmux-agent-activity.sh)#(~/.dotfiles/base/tmux-windows-active.sh)#(~/.dotfiles/base/tmux-vitals.sh)#[fg=colour109]#(date -u +%%H:%%MZ)'

# Terminal title (what the emulator shows in its tab/titlebar — iTerm2,
# Windows Terminal, Ghostty, Alacritty, etc.). Format: "<host> <window>".
# The host is the short label from tmux-tabhost.sh (your hosts file's label,
# else the short hostname) — the machine where the tmux SERVER runs, which is what you
# want when tabs ssh out to different boxes. #W is the current window name
# (auto-renamed to dir/command below, or set by the Claude /rename hook),
# and tmux re-emits the title on window switch, so each tab tracks what its
# tmux is focused on live. The status bar (tmux-hostname.sh) still shows
# the longer host:session form.
#
# NOTE: #() command substitution is NOT reliably expanded in title strings
# (it's a status-line feature), so the host code — which never changes for
# the life of the server — is computed ONCE here via run-shell and baked
# into the option as a literal. #W stays a live format var.
#
# A window flagged @handoff_to (see @handoff-badge above) gets a 🔴⤳ prefix:
# the badge's red, in the one place colors cannot render.
set -g set-titles on
# (##W because run-shell format-expands its argument — ## survives as a
# literal # so the stored option keeps a live #W. Same for the ##{?...}.)
if-shell 'tmux run-shell -E ":" >/dev/null 2>&1' \
    'run-shell -E "tmux set -g set-titles-string \"$(~/.dotfiles/base/tmux-tabhost.sh) ##{?##{@handoff_to},🔴⤳ ,}##W\""' \
    'run-shell "tmux set -g set-titles-string \"$(~/.dotfiles/base/tmux-tabhost.sh) ##{?##{@handoff_to},🔴⤳ ,}##W\""'

# Window naming: show directory for shells, command name for others
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Quick window switching with Alt+number
bind -n M-h previous-window    # Alt+h = previous window (mobile-friendly)
bind -n M-l next-window        # Alt+l = next window (mobile-friendly)
bind -n M-s switch-client -n   # Alt+s = next session (cycles, wraps)
bind -n M-S switch-client -p   # Alt+Shift+s = previous session
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Easy split panes
# SSH-aware, same as `prefix c` below: splitting a pane that is ssh'd somewhere
# gives you another shell on that box, not a local one.
if-shell 'test -x ~/.dotfiles/base/tmux-ssh-inherit.sh' \
    'bind | run-shell "~/.dotfiles/base/tmux-ssh-inherit.sh hsplit #{pane_id}"' \
    'bind | split-window -h -c "#{pane_current_path}"'
if-shell 'test -x ~/.dotfiles/base/tmux-ssh-inherit.sh' \
    'bind - run-shell "~/.dotfiles/base/tmux-ssh-inherit.sh vsplit #{pane_id}"' \
    'bind - split-window -v -c "#{pane_current_path}"'

# New windows start in current directory (not session start directory), and
# are inserted AFTER the current window (`-a`) rather than appended to the
# end. Combined with `renumber-windows on` below, this keeps indexes
# contiguous so the new window slots in at `current_index + 1`.
#
# SSH INHERITANCE: when the current pane is running ssh, the new window opens
# ALREADY CONNECTED to the same host (and the same remote directory, if the
# remote shell reports it via OSC 7 — base/zshrc does). Previously `prefix c`
# from an ssh'd pane dropped you on the LOCAL box with a cwd copied from
# wherever the pane was before it connected, so every new window meant retyping
# the ssh and the cd.
#
# The helper is a strict superset of the old binding: for a non-ssh pane it
# execs precisely `new-window -a -c <pane_current_path>`, and it falls back to
# that on ANY failure to identify the connection (see the script's header for
# the ProxyJump and remote-command subtleties it handles). `prefix C-c` below
# forces the local window when you want one.
#
# run-shell (not the command directly) because the decision needs the process
# table, which tmux formats cannot read. -b would background it; without it the
# new window is created before the key returns, so there is no visible lag.
if-shell 'test -x ~/.dotfiles/base/tmux-ssh-inherit.sh' \
    'bind c run-shell "~/.dotfiles/base/tmux-ssh-inherit.sh window #{pane_id}"' \
    'bind c new-window -a -c "#{pane_current_path}"'

# Escape hatch: always a LOCAL window, even from an ssh'd pane. Same key as the
# stock new-window, plus Ctrl — mnemonically "c, but don't be clever".
bind C-c new-window -a -c "#{pane_current_path}"

# Mobile-friendly bindings (after Ctrl+B prefix)
bind k send-keys C-c          # Ctrl+B then k = Ctrl+C (kill/interrupt)
bind q send-keys C-d          # Ctrl+B then q = Ctrl+D (exit/EOF)
bind z send-keys C-z          # Ctrl+B then z = Ctrl+Z (suspend)
bind l send-keys C-l          # Ctrl+B then l = Ctrl+L (clear)
# NOTE: wrap `claude` in a login+interactive zsh (`zsh -lic`) so the new window
# sources ~/.zshrc (-> ~/.env_secrets) and picks up the CURRENT credentials
# (an API key or cloud token). Without this, tmux runs the command via a bare
# `sh -c` that inherits the tmux *server's* frozen env snapshot — a stale
# token from whenever the server started => an API authentication error.
# (This is why `prefix c` + typing `claude` works but a raw command binding didn't.)
bind a new-window -a -n yolo -c "#{pane_current_path}" 'exec zsh -lic "claude --dangerously-skip-permissions"' \; setw automatic-rename off
bind A new-window -a -n claude -c "#{pane_current_path}" 'exec zsh -lic "claude \"hi\""' \; setw automatic-rename off
bind -n M-a new-window -a -n yolo -c "#{pane_current_path}" 'exec zsh -lic "claude --dangerously-skip-permissions"' \; setw automatic-rename off
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
bind -n M-y kill-window           # Alt+y = kill window (no prefix, easier than &)
if-shell 'tmux show-options -gw tree-mode-preview-format >/dev/null 2>&1' \
    'bind b if -F "#{==:#{status},off}" "set -g status 2" "set -g status off"' \
    'bind b set -g status'
if-shell 'tmux show-options -gw tree-mode-preview-format >/dev/null 2>&1' \
    'bind B if -F "#{==:#{status},2}" "set -g status on" "set -g status 2"' \
    'unbind -q B'
# Row 0 window clicks and row 1 session clicks both arrive here already resolved:
# tmux hands range=window / range=session targets to this key as `-t=`. switch-client
# follows a session target across sessions and a window target within one, so the
# stock 3.7 binding covers both rows. Older tmux keeps its own select-window default.
if-shell 'tmux show-options -gw tree-mode-preview-format >/dev/null 2>&1' \
    'bind -n MouseDown1Status switch-client -t=' \
    'bind -n MouseDown1Status select-window -t='

# Ctrl-K Clears the Scroll buffer
bind -n C-k clear-history

# Mouse-drag-release: copy selection without snapping back to the live tail.
# Default binding is copy-pipe-and-cancel, which exits copy mode and drops the
# scrollback view. copy-selection copies + clears highlight but keeps you in
# copy mode at the same scroll offset; q/Esc/scroll exits normally.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection

# Prefix + C → copy entire pane scrollback to system clipboard (cross-platform)

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Config for Continuum / Resurrect
set -g @continuum-restore 'off'       # Manual restore only (prefix + Ctrl-r)
set -g @continuum-save-interval '15'  # Explicit (matches the plugin default)

# CAVEAT — continuum CANNOT auto-save a detached server, and no interval value
# changes that. It schedules saves by injecting #(continuum_save.sh) into
# status-right, so a save only fires when the status bar REDRAWS, which tmux
# only does for an ATTACHED CLIENT. Verified: status-interval=1 with no client
# attached never ran a #() in status-right, and a busy detached server went 4h+
# without a layout snapshot while holding dozens of agent sessions.
# The backstop is a systemd user timer, NOT a tmux setting:
#   ~/.dotfiles/systemd/user/tmux-resurrect-autosave.timer
#   ~/.dotfiles/scripts/tmux-resurrect-autosave  (stands down if continuum is live)
set -g @resurrect-strategy-vim 'session' # Restore Vim sessions
set -g @resurrect-strategy-nvim 'session' # Restore Neovim sessions
set -g @resurrect-capture-pane-contents 'on'

# Claude and Codex sessions: resurrect cannot natively identify which agent
# UUID each pane owns. These hooks snapshot exact pane/session mappings and
# resume with `claude --resume <uuid>` or `codex resume <uuid>` after layout
# restore. The script names predate Codex support and are kept for compatibility.
set -g @resurrect-hook-post-save-all    'bash ~/.dotfiles/scripts/tmux-resurrect-claude-save'
set -g @resurrect-hook-post-restore-all 'bash ~/.dotfiles/scripts/tmux-resurrect-claude-restore'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell 'tmux run-shell -E ":" >/dev/null 2>&1' \
    'run-shell -E "~/.tmux/plugins/tpm/tpm"' \
    'run-shell "~/.tmux/plugins/tpm/tpm"'

# OSC 52 clipboard passthrough (used by tmux-copy-buffer.sh for remote sessions).
# Lets nested applications (scripts, nvim, etc.) send clipboard escape sequences
# through tmux to the outer terminal emulator.
set -g allow-passthrough on
set -s set-clipboard on

# Alt-c  — capture full pane scrollback into tmux's internal paste buffer.
#          Paste with `prefix + ]` inside any tmux pane. No prefix needed here
#          (`-n` = root binding), so it's one keystroke.
bind -n M-c capture-pane -S - -E - \; display-message 'captured scrollback to tmux buffer'

# Alt-C  — same capture but also send to local terminal's clipboard via OSC 52
#          (falls back to pbcopy/clip.exe/xclip when present; works over SSH via
#          allow-passthrough).
if-shell 'tmux run-shell -E ":" >/dev/null 2>&1' \
    'bind -n M-C run-shell -E "~/.dotfiles/base/tmux-copy-buffer.sh"' \
    'bind -n M-C run-shell "~/.dotfiles/base/tmux-copy-buffer.sh"'
