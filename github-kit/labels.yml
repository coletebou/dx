# labels.yml: the label set sync-labels.sh applies to a repository (sync-labels.sh --help).
#
# A YAML list of mappings with these keys, one label each:
#   name         the label; GitHub compares names case-insensitively (at most 50 characters)
#   color        six hex digits, without a leading "#"
#   description  optional (at most 100 characters)
# Quote every value: unquoted, a color such as 000000 or 1e3456 reads as a number in YAML.
#
# The size/* and proof: * families are the ones workflows/pr-labels.yml applies, with the same
# colors and descriptions as its scripts/pr-labels.mjs. merge-risk: * is for reviewers, and
# ci:full opts a draft pull request into the full CI lane (workflows/ci-full-label.yml).
# Add labels for the parts of your project in the same shape, for example:
#   - name: "area: docs"
#     color: "c5def5"
#     description: "The documentation"

# GitHub's default labels.
- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

# Kind and triage.
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
- name: "security"
  color: "b60205"
  description: "A vulnerability, a hardening, or a change to how secrets are handled"
- name: "performance"
  color: "ffa500"
  description: "Slower or heavier than it should be"
- name: "ci"
  color: "1d76db"
  description: "CI/CD pipelines and workflows"
- name: "chore"
  color: "fef2c0"
  description: "Maintenance, tooling, housekeeping"
- name: "needs-triage"
  color: "d93f0b"
  description: "Needs priority and owner"
- name: "priority: critical"
  color: "b60205"
  description: "Data loss, a security hole or an outage; drop everything"
- name: "priority: high"
  color: "d93f0b"
  description: "Next in line"
- name: "priority: medium"
  color: "fbca04"
  description: "Soon, after the high-priority work"
- name: "priority: low"
  color: "c2e0c6"
  description: "When there is time"
- name: "ci:full"
  color: "0e8a16"
  description: "Run the full CI lane on this draft pull request"

# size/*: lines changed, set by pr-labels.yml on every push.
- name: "size/XS"
  color: "ededed"
  description: "Under 20 lines changed (lockfiles and generated files not counted)"
- name: "size/S"
  color: "c2e0c6"
  description: "20-99 lines changed (lockfiles and generated files not counted)"
- name: "size/M"
  color: "fbca04"
  description: "100-499 lines changed (lockfiles and generated files not counted)"
- name: "size/L"
  color: "e99695"
  description: "500-999 lines changed (lockfiles and generated files not counted)"
- name: "size/XL"
  color: "b60205"
  description: "1000+ lines changed; consider splitting before review"

# proof: *: the evidence a pull request carries, set by pr-labels.yml (the override by hand).
- name: "proof: ✅ sufficient"
  color: "1a7f37"
  description: "Real behavior proof covers the change: screenshots for UI, E2E or a live run for behavior"
- name: "proof: 📸 needs screenshots"
  color: "d93f0b"
  description: "Changes UI a user can see, but the PR has no screenshots or recording of it"
- name: "proof: 🧪 needs e2e"
  color: "fbca04"
  description: "Behavior is only proven by unit tests, mocks, typecheck or CI; needs an E2E or live run"
- name: "proof: ➖ not needed"
  color: "c5def5"
  description: "Docs, comments, or a change where CI itself is the real proof"
- name: "proof: 🙋 override"
  color: "8250df"
  description: "A maintainer settled the proof question by hand; automation leaves proof labels alone"

# merge-risk: *: a reviewer's call, with the failure mode written in the review.
- name: "merge-risk: 🚨 security"
  color: "b60205"
  description: "Could weaken auth, secrets, sandboxing or isolation, or expose private data"
- name: "merge-risk: 🚨 breaking"
  color: "d1242f"
  description: "Could break existing users, API contracts, config, defaults, migrations or upgrades"
- name: "merge-risk: 🚨 data"
  color: "d1242f"
  description: "Could lose, corrupt or wrongly delete user data, files, sessions or history"
- name: "merge-risk: 🚨 availability"
  color: "d93f0b"
  description: "Could crash, hang or take down a service, host or deploy"
- name: "merge-risk: 🚨 automation"
  color: "fbca04"
  description: "Could break CI, deploys, scheduled jobs, label gates or other automation"
