name: Feature request
description: Suggest a new capability, or a change to how something works.
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the open and closed issues first: it may already be planned, or have been decided against with a reason.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today. A concrete example helps more than a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Commands, configuration or output you would expect to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use now, or other ways it could be solved.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you open a pull request for it?
      options:
        - "Yes"
        - Maybe, with some guidance
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not one of them.
          required: true
        - label: I removed secrets, tokens, hostnames, IP addresses and personal data from everything above.
          required: true
