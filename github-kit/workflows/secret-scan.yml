name: Secret Scan

# gitleaks over what each event adds: a pull request's commits, or the commits
# a push brings to the default branch. Needs no secrets. A .gitleaks.toml at
# the repository root, when there is one, supplies the rules and allowlist;
# otherwise gitleaks' default rules apply. Make its check required to block
# merges that add a credential.
#
# Merge commits are scanned too: a pull request's merges as remerge diffs
# (their own edits, not what they bring in from the base), octopus merges
# against the base, and a push's merges against their first parent.

on:
  pull_request:
  push:
    branches: [main, master]

# Cancel a superseded PR scan; every push is scanned to completion.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the scanned range is always there.
          fetch-depth: 0
          persist-credentials: false

      # The sums are the ones in the v8.30.1 release's checksums file.
      - name: Install gitleaks 8.30.1
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)   asset=linux_x64   sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            Linux/ARM64) asset=linux_arm64 sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "::error::no gitleaks build pinned for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${asset}.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          config=()
          if [[ -f .gitleaks.toml ]]; then config=(--config .gitleaks.toml); fi
          # A new branch has no "before", and a force push's may be gone: scan
          # everything reachable from the new tip then.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Scanning the whole history of $AFTER_SHA"
            gitleaks git --log-opts="--diff-merges=first-parent $AFTER_SHA" "${config[@]}" --no-banner --redact
          else
            echo "Scanning $BEFORE_SHA..$AFTER_SHA"
            gitleaks git --log-opts="--diff-merges=first-parent $BEFORE_SHA..$AFTER_SHA" "${config[@]}" --no-banner --redact
          fi

      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          config=()
          if [[ -f .gitleaks.toml ]]; then config=(--config .gitleaks.toml); fi
          echo "Scanning $BASE_SHA..$HEAD_SHA"
          # Remerge diffs show a two-parent merge's own edits without replaying
          # what it brings in from the base.
          gitleaks git --log-opts="--diff-merges=remerge $BASE_SHA..$HEAD_SHA" "${config[@]}" --no-banner --redact
          # Git cannot remerge an octopus merge, so each one's result is compared
          # with the base through a one-parent synthetic commit. Its objects go
          # to a private temporary store: the refs and the repository's object
          # store are never written.
          octopus="$(git rev-list --min-parents=3 "$BASE_SHA..$HEAD_SHA")"
          [[ -n "$octopus" ]] || exit 0
          objects="$(git rev-parse --path-format=absolute --git-path objects)"
          scratch="$(mktemp -d "$RUNNER_TEMP/secret-scan-objects.XXXXXX")"
          while IFS= read -r merge; do
            synthetic="$(GIT_OBJECT_DIRECTORY="$scratch" GIT_ALTERNATE_OBJECT_DIRECTORIES="$objects" \
              git -c user.name='Secret Scan' -c user.email=secret-scan@example.invalid \
              commit-tree "${merge}^{tree}" -p "$BASE_SHA" -m "Scan octopus result $merge")"
            echo "Scanning octopus merge $merge"
            GIT_OBJECT_DIRECTORY="$scratch" GIT_ALTERNATE_OBJECT_DIRECTORIES="$objects" \
              gitleaks git --log-opts="--max-count=1 $synthetic" "${config[@]}" --no-banner --redact
          done <<< "$octopus"
