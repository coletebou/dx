name: Claude Code Review

# One review round per head you mean to merge. A round starts when a pull
# request is opened or reopened while ready, or marked "Ready for review". Fix
# pushes (`synchronize`) do not start one: work through the comments, then
# convert the PR to draft and mark it ready again for the next round. A run by
# hand (Actions > Claude Code Review > Run workflow) reviews any open
# same-repository PR, with an optional model for that run. `@claude` comments
# still get an on-demand run through claude.yml.
#
# Setup (README.md in the kit, "Claude workflows"): ONE credential as a secret
# of environment "claude" (or of the repository), ANTHROPIC_API_KEY or
# CLAUDE_CODE_OAUTH_TOKEN; optionally the repository variable
# CLAUDE_REVIEW_MODEL (else CLAUDE_MODEL) with the model id to review with.
# Unset, the action's default model runs. Without a credential the job says so
# in a warning and does nothing else.
#
# pull_request_target: the workflow file always comes from the base branch, so
# a pull request cannot edit it to read the secret. Claude reads the diff
# through the API; it never checks out or runs the pull request's code. Fork
# and bot PRs are skipped: their title, body and diff are untrusted prompt
# input, and this job holds a write token.
# GitHub token: the Claude app's token exchange rejects OIDC tokens from
# pull_request_target runs, so the action posts with this job's own
# GITHUB_TOKEN (comments come from github-actions[bot]) and the job needs no
# id-token permission.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request to review (an open, same-repository PR)
        required: true
        type: number
      model:
        description: Model id for this review (empty - CLAUDE_REVIEW_MODEL, else CLAUDE_MODEL, else the action's default)
        required: false
        type: string
        default: ''

# A newer trigger (reopened right after ready_for_review, say) supersedes the
# review already running for this PR, instead of paying for two.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions: {}

jobs:
  claude-review:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        !github.event.pull_request.draft &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: claude
    # A wedged run must not burn the six-hour default.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Check the configuration and the pull request
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          MODEL: ${{ inputs.model || vars.CLAUDE_REVIEW_MODEL || vars.CLAUDE_MODEL }}
        run: |
          if [[ "$HAS_API_KEY" != true && "$HAS_OAUTH_TOKEN" != true ]]; then
            echo "::warning::No credential: set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret (environment \"claude\" or the repository) to turn on reviews."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::not a pull request number: $PR"
            exit 1
          fi
          if [[ "$EVENT" == workflow_dispatch ]]; then
            state="$(gh pr view "$PR" --json state,isCrossRepository --jq '"\(.state) \(.isCrossRepository)"')"
            if [[ "$state" != "OPEN false" ]]; then
              echo "::error::PR #$PR is not an open same-repository pull request (state, cross-repository: $state)."
              exit 1
            fi
          fi
          tools='--allowedTools "Bash(gh *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git fetch *),mcp__github_inline_comment__create_inline_comment"'
          if [[ -n "$MODEL" ]]; then
            if [[ ! "$MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:@/-]*$ ]]; then
              echo "::error::the model is not a model id: $MODEL"
              exit 1
            fi
            tools="--model $MODEL $tools"
          fi
          {
            echo "ready=true"
            echo "pr=$PR"
            echo "claude_args=$tools"
          } >> "$GITHUB_OUTPUT"

      # The base branch (pull_request_target) or the ref the run was started
      # from (workflow_dispatch): never the pull request's head.
      - name: Checkout repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.config.outputs.ready == 'true'
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.config.outputs.pr }}'
          track_progress: ${{ github.event_name == 'pull_request_target' }}
          claude_args: ${{ steps.config.outputs.claude_args }}
