name: CI Full On Approval

# A ready PR runs the full CI lane on every push, so this only covers the gap:
# when a same-repository, non-draft PR is approved on its current head and the
# PR's own full run of that head failed or was cancelled, it reruns that run.
# PRs that carry `ci:full` are skipped at the job `if:`, and a review that
# approved an older commit is ignored; the next approval of the current head
# acts.
#
# A rerun, not a dispatch: a PR's checks, and the checks a branch protection
# rule or ruleset requires, are the PR's pull_request runs. A workflow_dispatch
# run's checks attach to the head commit and show in the Actions tab, but never
# in the PR's checks, so a green dispatched run cannot repair a red required
# check. Rerunning the PR's run makes a new attempt of it, which can. A rerun
# keeps the run's commit and event, so a run started while the PR was a draft
# (its full lane skipped) runs the fast lane again: such a head is left alone,
# and the summary says how to get a full run.
#
# Off until the repository variable CI_FULL_WORKFLOW names the full CI
# workflow file. The full lane is one job of it, named by the variable
# CI_FULL_JOB (default `full`), that runs only on the full lane and is skipped
# on a draft's fast lane (the kit's README.md has the contract).
#
# Two guards run in the step, because the job `if:` reads the event payload,
# which can be stale by the time the step runs:
#   - the branch tip must still equal the approved SHA, and
#   - a head with a full run in flight (any event: a rerun would join its
#     concurrency group and cancel it) or a passed full run of the PR is left
#     alone, so a second approver or a re-submitted approval cannot cancel and
#     restart the suite.
# A pull_request run of this PR's head branch that has not created its jobs
# yet counts as in flight: it waits in the PR's concurrency group while the
# previous head's run cancels, and an approval often lands in that window.
#
# Whose run a run is: GitHub records no triggering PR on a run. Its
# `pull_requests` are the PRs open NOW whose head matches it, so two PRs on one
# head branch (into two bases) both appear on each other's runs, and once one
# closes, its runs list only the other. The evidence used instead is the run's
# title, fixed when the run is created: the full CI workflow sets
# `run-name: ci-full #<PR> -> <base>` from its triggering event (the kit's
# README.md has the contract). A run is this PR's when it is a pull_request
# run from this repository titled exactly `ci-full #<this PR> -> <its base
# now>`. Titled for this PR but another base (it ran before a retarget), it is
# not rerun: a rerun keeps the run's merge commit, so it would test that base
# again. A run with any other title (no run-name, so the PR's title) is never
# this PR's: it is reported, not rerun. A fork's run of the same commit, even
# from a branch of the same name, has another head repository and never is.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  ci-full-rerun:
    if: >-
      vars.CI_FULL_WORKFLOW != '' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      !contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize decisions for the same PR; approvals must not both inspect
    # an uncovered head and rerun the same run at the same time.
    concurrency:
      group: ci-full-on-approval-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Rerun the PR's full CI lane for the approved head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ vars.CI_FULL_WORKFLOW }}
          FULL_JOB: ${{ vars.CI_FULL_JOB || 'full' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          tip="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [[ "$tip" != "$HEAD_SHA" ]]; then
            echo "Branch tip ${tip:0:7} moved past the approved ${HEAD_SHA:0:7}; nothing to rerun." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Each run of the head, newest first, is first placed by its title:
          # "mine" (a pull_request run from this repository titled
          # `ci-full #<this PR> -> <its base now>`), "stale <base>" (titled for
          # this PR, another base), "untagged" (a pull_request run from this
          # repository with another title) or "other" (another PR's, a fork's,
          # a dispatch). Then it is one of:
          #   inflight  not finished, with FULL_JOB running or still to come
          #   passed    this PR's, with FULL_JOB and the whole run passed
          #   rerun     this PR's and finished, its full lane failed or cancelled
          #             (or the run cancelled before its jobs existed)
          #   draft     this PR's and finished, with FULL_JOB skipped
          #   stale     finished, this PR's run against another base
          #   untagged  finished, and not tied to any PR by its title
          #   none      anything else, a finished dispatched run among them
          #             (never one of the PR's checks)
          rerun="" draft=0 stale="" untagged=0
          for run_id in $(gh run list --workflow "$WORKFLOW" --commit "$HEAD_SHA" \
            --json databaseId --jq '.[].databaseId'); do
            # shellcheck disable=SC2016 # $tag is a jq variable
            owner="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" --jq '
              ([.display_title // "" | match("^ci-full #([0-9]+) -> ([^ ]+)$") | .captures | map(.string)] | first) as $tag
              | if .event != "pull_request" or (.head_repository.full_name | ascii_downcase) != (env.GH_REPO | ascii_downcase) then "other"
                elif $tag == null then "untagged"
                elif $tag[0] != env.PR_NUMBER then "other"
                elif $tag[1] != env.BASE_REF then "stale " + $tag[1]
                else "mine" end')"
            # shellcheck disable=SC2016 # $run, $status and $job are jq variables
            state="$(OWNER="${owner%% *}" gh run view "$run_id" --json status,conclusion,jobs,event --jq '
              .conclusion as $run
              | .status as $status
              | ([.jobs[] | select(.name == env.FULL_JOB)] | first) as $job
              | if $status != "completed" then
                  if $job == null then
                    if env.OWNER != "other" or .event == "workflow_dispatch" or .event == "merge_group" then "inflight" else "none" end
                  elif $job.conclusion == "skipped" then "none"
                  else "inflight" end
                elif env.OWNER == "stale" or env.OWNER == "untagged" then env.OWNER
                elif env.OWNER != "mine" then "none"
                elif $job == null then "rerun"
                elif $job.conclusion == "skipped" then "draft"
                elif $job.conclusion == "success" and $run == "success" then "passed"
                else "rerun" end')"
            case "$state" in
              inflight|passed)
                echo "Head ${HEAD_SHA:0:7} already has a ${WORKFLOW} full run in flight or passed; nothing to rerun." >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              rerun) [[ -n "$rerun" ]] || rerun="$run_id" ;;
              draft) draft=1 ;;
              stale) stale="${owner#stale }" ;;
              untagged) untagged=1 ;;
            esac
          done
          if [[ -z "$rerun" ]]; then
            if [[ "$untagged" == 1 ]]; then
              echo "${WORKFLOW} runs of ${HEAD_SHA:0:7} are not titled \`ci-full #<PR> -> <base>\`, so none can be tied to PR #${PR_NUMBER} and none is rerun. Set that run-name in ${WORKFLOW}, as the kit's README.md says." >> "$GITHUB_STEP_SUMMARY"
            elif [[ -n "$stale" ]]; then
              echo "PR #${PR_NUMBER}'s ${WORKFLOW} runs of ${HEAD_SHA:0:7} tested base \`${stale}\`, not its base now (\`${BASE_REF}\`), and a rerun would test \`${stale}\` again. Convert the PR to draft and mark it ready for review again to run the full lane." >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$draft" == 1 ]]; then
              echo "PR #${PR_NUMBER}'s only ${WORKFLOW} run of ${HEAD_SHA:0:7} is a draft's fast lane, which a rerun would repeat. Convert the PR to draft and mark it ready for review again to run the full lane." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR #${PR_NUMBER} has no ${WORKFLOW} run of ${HEAD_SHA:0:7} to rerun." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          gh run rerun "$rerun"
          echo "Reran ${WORKFLOW} run ${rerun}, PR #${PR_NUMBER}'s full lane for \`${HEAD_REF}\` at ${HEAD_SHA:0:7}, on approval." >> "$GITHUB_STEP_SUMMARY"
