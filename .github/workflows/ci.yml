name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run is cancelled; a push run never is, so every pushed range is scanned.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Ubuntu's apt ShellCheck is 0.9; the sum is the v0.11.0 release asset's digest.
      - name: Install ShellCheck 0.11.0, zsh, jq and ruff
        run: |
          dir="$RUNNER_TEMP/shellcheck"
          curl -fsSL --retry 3 -o "$dir.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $dir.tar.xz" | sha256sum -c -
          mkdir -p "$dir"
          tar -xJf "$dir.tar.xz" -C "$dir" --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$dir" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y zsh jq
          python -m pip install ruff==0.17.2
      - name: Lint (ShellCheck, zsh -n, ruff, jq)
        run: bash scripts/tests/lint.sh

  # This repository's workflows, and the GitHub repo kit's with the kit's own actionlint config.
  # The image digest pins actionlint 1.7.12 and the ShellCheck it runs on every run: block.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (.github/workflows)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: actionlint (github-kit/workflows)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color \
            -config-file github-kit/actionlint.yaml github-kit/workflows/*.yml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The sum is the one in the v8.30.1 release's checksums file.
      - name: Install gitleaks 8.30.1
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan every commit
        run: gitleaks git . --redact --no-banner

  suites:
    name: suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # gitleaks: dotsync's and codesync's suites run their secret gate for real; trufflehog: the
      # autoreview skill's suites refuse a review pack without it (each sum is its release's own).
      - name: Install tmux, zsh, jq, gitleaks and trufflehog
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install tmux jq gitleaks trufflehog
          else
            sudo apt-get update && sudo apt-get install -y tmux zsh jq
            tgz="$RUNNER_TEMP/gitleaks.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
            tgz="$RUNNER_TEMP/trufflehog.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" \
              https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.7/trufflehog_3.99.7_linux_amd64.tar.gz
            echo "bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP" trufflehog
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          fi
          # Suites that commit set their own identity; this covers any that rely on the global one.
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch master
      - name: Versions
        run: |
          bash --version | head -n 1
          tmux -V
          zsh --version
          jq --version
          git --version
          python3 --version
          node --version
      # Includes install.test.sh: a dry run, then a real install into a throwaway HOME.
      - name: Every suite
        env:
          RUN_ALL_LOG_DIR: ${{ runner.temp }}/suite-logs
        run: bash scripts/tests/run-all.sh
      - name: Keep the failing suites' whole output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/suite-logs
          if-no-files-found: ignore
          retention-days: 14
